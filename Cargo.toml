[package]
name = "terminal_contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The request and reply words of a terminal served over a message-passing call: operations, flags, badges and the supervisor's swap messages"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partsfoundry/terminal_contract"
readme = "README.md"
keywords = ["no-std", "terminal", "protocol"]
categories = ["no-std", "no-std::no-alloc", "os"]
publish = false     # stays false until the release that publishes this crate

# The wire half of a terminal: the words its clients, its input driver and its supervisor send it,
# and the words it answers with. A leaf with no dependencies, so every side links the words
# without linking the line editor that serves them.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
